[package]
name = "tuya-meter"
version = "0.1.0"
edition = "2021"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
cipher = { version = "0.4", features = ["block-padding"] }
crc32fast = "1.4"
ecb = "0.1"
hmac = "0.12"
md-5 = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rumqttc = "0.24"

[profile.release]
opt-level = "s"
lto = true
strip = true
