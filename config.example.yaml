# AT4P-W Tuya Power Meter - Configuration Example
# Copy this file to config.yaml and fill in your values

device:
  ip: 192.168.1.100          # Device IP on your LAN
  id: your_device_id_here    # Tuya device ID (from IoT Platform)
  local_key: your_local_key  # 16-char local key (from IoT Platform)
  version: "3.5"             # Protocol version: "3.3", "3.4", or "3.5"

# Optional: MQTT bridge with Home Assistant auto-discovery
# Remove this section if you only need CLI usage
mqtt:
  host: "192.168.1.1"        # MQTT broker address (IPv6 without brackets)
  port: 1883                 # MQTT broker port
  poll_secs: 10              # How often to poll the meter (seconds)
  node_id: at4pw             # HA discovery node ID & topic prefix
